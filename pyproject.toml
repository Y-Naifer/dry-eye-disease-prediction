[project]
name = "dry-eye-disease-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yessine Naifer", email = "yessine@tu-berlin.de" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
dry-eye-disease-prediction = "dry_eye_disease_prediction:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
